services:
  flexnet:
    image: ${FLEXNET_IMAGE:-flexnetserver:local}
    platform: ${FLEXNET_PLATFORM:-linux/amd64}
    build:
      context: .
      dockerfile: Dockerfile
      additional_contexts:
        build-context: ./packages
      args:
        FLEXNET_PACKAGE_URL: ${FLEXNET_PACKAGE_URL}
    hostname: ${FLEXNET_HOSTNAME}
    mac_address: ${FLEXNET_MAC_ADDRESS}
    init: true
    restart: unless-stopped
    command: ${FLEXNET_COMMAND}
    ports:
      - "${FLEXNET_PORT:-2100}:2100"
    volumes:
      - ./licenses/latest.lic:/usr/local/flexlm/licenses/license.dat:ro
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test:
        - CMD
        - /usr/local/bin/lmutil
        - lmstat
        - -c
        - /usr/local/flexlm/licenses/license.dat
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
